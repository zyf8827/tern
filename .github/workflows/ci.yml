name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code format check
        run: pnpm format:check

      - name: Lint check
        run: pnpm lint

      - name: Build all packages & apps
        run: pnpm -r build

      - name: Bundle MCP standalone binary
        run: node scripts/bundle-mcp.mjs dist/tern-mcp.mjs

      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: E2E Tests (Optional)
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers & OS dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm -r build

      - name: Run E2E test suite
        run: pnpm test:e2e
