name: 特性需求建议 (Feature Request)
description: 建议 Tern 平台的新能力或改进
title: '[Feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢为 Tern 贡献新想法与设计建议！
  - type: textarea
    id: problem
    attributes:
      label: 痛点与背景 (Problem / Context)
      description: 解释目前无法达成或体验不够好的场景。
      placeholder: 例如：当需要通过 Slack 接收测试运行完成通知时...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 (Proposed Solution)
      description: 描述你理想中的实现或功能形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充说明 (Alternatives Considered)
      description: 你是否尝试过其他方案？是否有参考实现？
