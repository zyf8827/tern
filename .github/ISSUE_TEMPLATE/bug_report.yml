name: 缺陷报告 (Bug Report)
description: 提交有关 Tern 平台、Worker、MCP 或 CLI 的缺陷
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢提交缺陷报告！请在报告前确认未包含任何企业敏感凭据或内网拓扑信息。
  - type: textarea
    id: description
    attributes:
      label: 缺陷描述 (Description)
      description: 清晰简要地说明发生的异常行为。
      placeholder: 例如：当运行多环境测试集时，条目去重未生效...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 提供最小可复现步骤。
      placeholder: |
        1. 在平台创建测试集 ...
        2. 调用 `tern run --project demo --suite smoke`
        3. 观察执行日志
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为 (Expected Behavior)
      description: 预期应当发生什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志与截图 (Logs / Screenshots)
      description: 粘贴相关的终端输出、Worker 执行日志或错误堆栈。
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: 涉及组件 (Component)
      options:
        - Server (apps/server)
        - Worker (apps/worker)
        - Web Console (apps/web)
        - MCP Server (apps/mcp)
        - CLI (packages/cli)
        - Exec Kit (packages/exec-kit)
        - Skill (skills/tern-project)
        - Documentation / Docker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境 (Environment)
      placeholder: e.g. Node 22, Ubuntu 22.04, Docker, Chromium 120
